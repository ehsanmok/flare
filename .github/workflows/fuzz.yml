name: Fuzz

on:
  schedule:
    - cron: '0 2 * * *'   # nightly at 02:00 UTC
  workflow_dispatch:        # manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux: pinned back to ``ubuntu-22.04`` (kernel 6.x, glibc
        # 2.35). On the latest ``ubuntu-latest`` runner image
        # (``ubuntu-24.04 / 20260413.86.1``, kernel 6.17.0, glibc
        # 2.39) the ``libKGENCompilerRTShared.so`` runtime crash that
        # was previously fixed reproduces again — the
        # fuzzer's tight mutate / JIT-execute loop trips it on the
        # very first run, before any harness work happens (see run
        # 25351119595). ``pixi run tests`` on the same image is
        # unaffected (CI doesn't drive the JIT hard enough), so
        # ``ci.yml`` stays on ``ubuntu-latest``. As with ci.yml, the
        # build side (sysroot pinned at glibc ``>=2.34`` via
        # conda-forge) keeps the resulting binaries portable down to
        # glibc 2.34 hosts. Revisit when the Mojo nightly grows a
        # fix, or when a future GHA image rolls a kernel that
        # doesn't trip the crash.
        #
        # macOS: ``macos-15``, matching ci.yml. This sat on
        # ``macos-14`` while ci.yml moved on, so the nightly fuzz run
        # and the per-push test run were on different macOS images.
        os: [ubuntu-22.04, macos-15]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: fuzz
          # Install straight from the committed pixi.lock; never re-solve
          # conda-forge in CI (the network solve is flaky). Fails loudly
          # if the lock has drifted from pixi.toml.
          locked: true
          cache: false
          post-cleanup: false

      # The corpus is what makes a fuzz run cumulative: mozz keeps every
      # input that reached new coverage under fuzz/corpus/<target>/, and
      # a run starting from an empty corpus spends its whole budget
      # rediscovering what last night already found. The key rolls per
      # run so each night writes a fresh entry; restore-keys walks back
      # to the most recent one for this OS.
      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.os }}-

      # One step, all 63 targets. This was ten hand-listed steps
      # covering ten of them: the entire QUIC, HTTP/3 and QPACK family
      # never ran, nor did either HTTP/2 denial-of-service harness --
      # the CONTINUATION flood and the rapid-reset (CVE-2023-44487)
      # cases, which are exactly the ones worth fuzzing nightly.
      - name: Fuzz and property tests (all targets)
        run: pixi run --environment fuzz fuzz-all

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.os }}-${{ github.run_id }}
          path: .mozz_crashes/
          if-no-files-found: ignore
